<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PRIVIS-HQ End-to-End MVP</title>
<style>body{margin:0;font:16px system-ui,sans-serif;color:#172033;background:#eef2f7}main{max-width:980px;margin:24px auto;padding:24px;background:#fff;border-radius:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}section{border:1px solid #d6dde8;border-radius:10px;padding:16px}label{display:block;margin-top:10px;font-weight:600}input,button{width:100%;box-sizing:border-box;padding:9px;margin-top:4px}button{cursor:pointer;background:#1769aa;color:white;border:0;border-radius:6px}pre{white-space:pre-wrap;background:#101827;color:#c9f7d5;padding:12px;min-height:80px}#qr{width:180px;height:180px;image-rendering:pixelated}#face{max-width:240px;max-height:220px;object-fit:cover}</style></head>
<body><main><h1>PRIVIS-HQ End-to-End MVP</h1><p>Local capture, detection, redaction, sanitized agent request, and safe local action execution.</p><div class="grid">
<section><h2>Before</h2><label>Password<input id="password" type="password" value="secretPassword"></label><label>Credit card<input id="card" autocomplete="cc-number" value="4111 1111 1111 1111"></label><label>CSC<input id="csc" autocomplete="cc-csc" value="123"></label><label>Email<input id="email" type="email" value="john@example.com"></label><label>Phone<input id="phone" type="tel" value="+91 9876543210"></label><p>Visible email: john@example.com</p><p>Visible phone: +91 9876543210</p><p>Normal text remains ordinary and unflagged.</p><button id="submit-button" data-privis-id="submit-button" type="button">Submit</button></section>
<section><h2>Real vision inputs</h2><canvas id="qr" width="180" height="180"></canvas><img id="face" src="fixtures/face.jpg" alt="local face fixture"></section>
<section><h2>Pipeline</h2><button id="capture">Capture &amp; Analyze</button><button id="sanitize">Sanitize &amp; Send</button><pre id="status">Waiting for local pipeline...</pre><pre id="output" hidden></pre></section></div></main>
<script>const status=document.getElementById("status");document.getElementById("submit-button").addEventListener("click",()=>{status.textContent="Submit action executed locally"});function run(){const requestId=crypto.randomUUID();const listener=event=>{if(event.source!==window||event.origin!==location.origin||event.data?.type!=="PRIVIS_RUN_STEP_RESULT"||event.data.requestId!==requestId)return;window.removeEventListener("message",listener);const result=event.data.result;status.textContent=JSON.stringify({decision:result?.decision,reason:result?.reason,actions:result?.actions},null,2)};window.addEventListener("message",listener);window.postMessage({type:"PRIVIS_RUN_STEP",requestId,goal:"Find the submit button and click it"},location.origin)}document.getElementById("capture").addEventListener("click",run);document.getElementById("sanitize").addEventListener("click",run)</script></body></html>
